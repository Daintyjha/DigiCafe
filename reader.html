<!-- =====================================================
     DIGICAFE READER
     This is a ROOM loaded inside index.html.

     Do NOT include:
     - navbar
     - footer
     - Beshy
     - global music player
     - scripts
===================================================== -->

<section class="book-layout">

    <section class="book-page">

        <!-- =================================================
             CONTENT TITLE
        ================================================== -->

        <h4 id="chapterTitle">
            Loading...
        </h4>


        <!-- =================================================
             CHAPTER SELECTOR
        ================================================== -->

        <div
            class="chapter-selector"
            id="chapterSelector"
        >

            <label for="chapterSelect">
                Chapter
            </label>

            <select id="chapterSelect">

                <option value="">
                    Select chapter
                </option>

            </select>

        </div>


        <!-- =================================================
             PUBLICATION DATE
        ================================================== -->

        <p
            id="publishedDate"
            class="published-date"
            style="display: none;"
        ></p>


        <!-- =================================================
             CHAPTER AUDIO
        ================================================== -->

        <div
            class="audio-bottom"
            id="audioContainer"
        >

            <audio
                id="chapterAudio"
                controls>
            </audio>

        </div>


        <!-- =================================================
             PDF CONTENT
        ================================================== -->

        <div id="chapterContent">

            <div id="pdfViewer"></div>

        </div>


        <!-- =================================================
             CHAPTER NAVIGATION
        ================================================== -->

        <div
            class="book-nav"
            id="chapterNavigation"
        >

            <button
                id="prevChapter"
                type="button"
            >
                ⬅ Previous
            </button>


            <button
                id="nextChapter"
                type="button"
            >
                Next ➡
            </button>

        </div>


        <!-- =================================================
             DIGICAFE INTERACTION
        ================================================== -->

        <div id="interactionContainer"></div>

    </section>


    <!-- =====================================================
         READER NOTE
    ====================================================== -->

    <div
        class="reader-note"
        id="readerNote"
    >

        <p>
            <i>
                You’ll find a small 🎧 icon at the bottom right
                of the screen—tap it to turn on ambient background
                sound while reading.
            </i>
        </p>

    </div>


    <!-- =====================================================
         READER NAVIGATION
    ====================================================== -->

    <div class="reader-nav">

        <a
            href="index.html?page=library"
            data-page="library"
        >
            ⬅ Library
        </a>


        <a
            href="index.html?page=romance"
            data-page="romance"
        >
            ⬅ Romance
        </a>


        <a
            href="index.html?page=comedy"
            data-page="comedy"
        >
            ⬅ Comedy
        </a>


        <a
            href="index.html?page=scifi"
            data-page="scifi"
        >
            ⬅ Sci-Fi
        </a>

    </div>

</section>
