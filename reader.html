<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta

        content="width=device-width, initial-scale=1.0"

    <title>Novels | DigiCafe</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="navbar"></div>


<main class="book-layout">

    <section class="book-page">

        <h4 id="chapterTitle">
            Loading...
        </h4>


        <div id="chapterContent">

            <div id="pdfViewer"></div>

        </div>


        <div class="book-nav">

            <button id="prevChapter">
                ⬅ Previous
            </button>

            <button id="nextChapter">
                Next ➡
            </button>

        </div>


        <!-- =================================================
             DIGICAFE INTERACTION PLACEHOLDER
        ================================================== -->

        <div id="interactionContainer"></div>


    </section>


    <div class="audio-bottom">

        <audio
            id="chapterAudio"
            controls>
        </audio>

    </div>


    <div class="reader-note">

        <p>
            <i>
                You’ll find a small 🎧 icon at the bottom right
                of the screen—tap it to turn on ambient background
                sound while reading.
            </i>
        </p>

    </div>


    <div class="reader-nav">

        <a href="library.html">
            ⬅ Library

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DigiCafe Account Test</title>

</head>


<body>

    <h1>DigiCafe Account Test</h1>


    <input
        id="email"
        type="email"
        placeholder="Email"
    >


    <input
        id="password"
        type="password"
        placeholder="Password"
    >


    <button id="register">
        Create Account
    </button>


    <button id="login">
        Log In
    </button>


    <button id="logout">
        Log Out
    </button>


    <p id="status">
        Not logged in
    </p>


    
</main>


<script src="stories.js"></script>

<script
    type="module"
    src="reader.js">
</script>

<script src="control-panel.js"></script>

<script src="script.js"></script>
<script
        type="module"
        src="auth-test.js">
    </script>

</body>

</html>
