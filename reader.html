
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DigiCafe Reader</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

<div id="navbar"></div>


<main class="book-layout">

    <section class="book-page">


        <!-- =================================================
             CONTENT TITLE
        ================================================== -->

        <h4 id="chapterTitle">
            Loading...
        </h4>


        <!-- =================================================
             PUBLICATION DATE
        ================================================== -->

        <p
            id="publishedDate"
            class="published-date"
            style="display: none;"
        ></p>


        <!-- =================================================
             AUDIO PLAYER
        ================================================== -->

        <div
            class="audio-bottom"
            id="audioContainer"
        >

            <audio
                id="chapterAudio"
                controls>
            </audio>

        </div>


        <!-- =================================================
             PDF CONTENT
        ================================================== -->

        <div id="chapterContent">

            <div id="pdfViewer"></div>

        </div>


        <!-- =================================================
             CHAPTER NAVIGATION
        ================================================== -->

        <div
            class="book-nav"
            id="chapterNavigation"
        >

            <button id="prevChapter">
                ⬅ Previous
            </button>


            <button id="nextChapter">
                Next ➡
            </button>

        </div>


        <!-- =================================================
             DIGICAFE INTERACTION
        ================================================== -->

        <div id="interactionContainer"></div>


    </section>


    <!-- =====================================================
         READER NOTE
    ====================================================== -->

    <div
        class="reader-note"
        id="readerNote"
    >

        <p>
            <i>
                You’ll find a small 🎧 icon at the bottom right
                of the screen—tap it to turn on ambient background
                sound while reading.
            </i>
        </p>

    </div>


    <!-- =====================================================
         READER NAVIGATION
    ====================================================== -->

    <div class="reader-nav">

        <a href="library.html">
            ⬅ Library
        </a>


        <a href="romance.html">
            ⬅ Romance
        </a>


        <a href="comedy.html">
            ⬅ Comedy
        </a>


        <a href="scifi.html">
            ⬅ Sci-Fi
        </a>

    </div>


</main>


<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="stories.js"></script>


<script
    type="module"
    src="reader.js">
</script>


<script
    src="control-panel.js">
</script>


<script
    src="script.js">
</script>


</body>

</html>
