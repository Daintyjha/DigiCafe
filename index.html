</head>

<body data-beshy-page="home">

```
<!-- =========================
     GLOBAL NAVBAR
========================== -->

<div id="navbar"></div>


<!-- =========================
     PAGE CONTENT

     Room pages are loaded here.

     DO NOT put navbar,
     footer, or music player
     inside the room files.
========================== -->

<main id="page-content"></main>


<!-- =========================
     GLOBAL MUSIC PLAYER

     music-player.html is loaded
     into this container by script.js.

     It stays outside #page-content
     so the audio survives navigation.
========================== -->

<div id="music-player"></div>


<!-- =========================
     GLOBAL FOOTER
========================== -->

<div id="footer"></div>


<!-- =========================
     GLOBAL BESHY
========================== -->

<div id="beshy-container"></div>


<!-- =========================
     DIGICAFE SHELL

     This must load FIRST.

     It loads:
     - navbar.html
     - music-player.html
     - footer.html
     - room pages
========================== -->

<!-- =========================
     DIGICAFE SHELL
========================== -->

<script src="script.js"></script>


<!-- =========================
     STORY DATABASE

     Must load before reader.js
     because reader.js uses
     window.STORIES.
========================== -->

<script src="stories.js"></script>


<!-- =========================
     GLOBAL MUSIC PLAYER LOGIC
========================== -->

<script src="music-player.js"></script>


<!-- =========================
     WELCOME SCREEN
========================== -->

<script src="welcome.js"></script>


<!-- =========================
     READER

     Reader is an ES module.
========================== -->

<script
    type="module"
    src="reader.js"
></script>


<!-- =========================
     BESHY
========================== -->

<script
    type="module"
    src="Beshy/beshy.js"
></script>
</body>

</html>
