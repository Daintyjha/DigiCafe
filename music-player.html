<!-- =========================
     GLOBAL DIGICAFE MUSIC PLAYER
========================= -->

<footer
    id="globalMusicPlayer"
    class="player"
>

<!-- =========================
     NOW PLAYING
========================== -->

<div class="now-playing">

    <div class="now-playing-info">

        <h3 id="trackTitle">
            Nothing playing
        </h3>

        <small id="playbackSource">
            Select a song to begin
        </small>

    </div>

</div>


<!-- =========================
     CONTROLS
========================== -->

<div class="controls">

    <div class="player-actions">

        <button
            id="favoriteBtn"
            type="button"
            aria-label="Play favorites"
            title="Favorites"
        >
            ♡
        </button>

    </div>


    <button
        id="prevBtn"
        type="button"
        aria-label="Previous song"
        title="Previous"
    >
        ⏮
    </button>


    <button
        id="playBtn"
        type="button"
        aria-label="Play or pause"
        title="Play / Pause"
    >
        ▶
    </button>


    <button
        id="nextBtn"
        type="button"
        aria-label="Next song"
        title="Next"
    >
        ⏭
    </button>


    <button
        id="shuffleBtn"
        type="button"
        aria-label="Shuffle"
        title="Shuffle"
    >
        🔀
    </button>

</div>


<!-- =========================
     PROGRESS
========================== -->

<div class="progress">

    <span id="currentTime">
        0:00
    </span>


    <input
        type="range"
        id="progressBar"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Song progress"
    >


    <span id="duration">
        0:00
    </span>

</div>


<!-- =========================
     VOLUME
========================== -->

<div class="volume">

    <span aria-hidden="true">
        🔊
    </span>


    <input
        type="range"
        id="volumeSlider"
        min="0"
        max="1"
        step="0.01"
        value="1"
        aria-label="Volume"
    >

</div>


<!-- =========================
     GLOBAL AUDIO ELEMENT

     DO NOT MOVE THIS INTO
     music.html.
========================== -->

<audio
    id="audioPlayer"
    preload="metadata">
</audio>
</footer>
