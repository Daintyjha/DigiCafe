<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Library | DigiCafe</title>

<meta
    name="description"
    content="Explore DigiCafe Library featuring fiction, blogs, discussions, stories, and creative writing by DaintyJha."
>

<meta
    name="author"
    content="DaintyJha"
>

<meta
    name="robots"
    content="index,follow"
>

<meta
    property="og:title"
    content="DigiCafe Library"
>

<meta
    property="og:description"
    content="A cozy digital library for stories, fiction, and thoughtful conversations."
>

<meta
    property="og:type"
    content="website"
>

<meta
    property="og:image"
    content="images/digicafe-preview.jpg"
>

<meta
    name="theme-color"
    content="#f5efe6"
>


<link
    href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@300;400;600&display=swap"

>

    href="style.css"
>

>

<body>


<!-- =====================================================
     NAVBAR
====================================================== -->

<div id="navbar"></div>


<!-- =====================================================
     LIBRARY
====================================================== -->

<main class="library">


    <h1>📚 DigiCafe Library</h1>


    <p class="library-intro">
        A quiet corner for stories, imagination,
        and thoughtful conversations.
    </p>


    <!-- =================================================
         FICTION
    ================================================== -->

    <section class="library-section">

        <h2>📖 Fiction</h2>


        <ul class="book-list">

            <li>
                <a href="romance.html">
                    Romance
                </a>
            </li>


            <li>
                <a href="comedy.html">
                    Comedy
                </a>
            </li>


            <li>
                <a href="scifi.html">
                    Sci-Fi
                </a>
            </li>

        </ul>

    </section>


    <!-- =================================================
         NON-FICTION
    ================================================== -->

    <section class="library-section">

        <h2>☕ Non-Fiction</h2>


        <!-- =================================================
             BLOG
        ================================================== -->

        <div class="nonfiction-category">

            <h3>📝 Blog</h3>


            <div
                id="blogList"
                class="content-list">
            </div>

        </div>


        <!-- =================================================
             DISCUSSION
        ================================================== -->

        <div class="nonfiction-category">

            <h3>💬 Discussion</h3>


            <div
                id="discussionList"
                class="content-list">
            </div>

        </div>


    </section>


    <!-- =================================================
         BESHY
    ================================================== -->

    <div id="beshy-container"></div>


</main>


<!-- =====================================================
     FOOTER
====================================================== -->

<div id="footer"></div>


<!-- =====================================================
     SCRIPTS
====================================================== -->

<script src="stories.js"></script>


<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {


        const blogList =
            document.getElementById(
                "blogList"
            );


        const discussionList =
            document.getElementById(
                "discussionList"
            );


        /* =================================================
           FORMAT DATE
        ================================================= */

        function formatDate(
            dateString
        ) {

            const date =
                new Date(
                    dateString +
                    "T00:00:00"
                );


            return date.toLocaleDateString(
                "en-US",
                {
                    year: "numeric",
                    month: "long",
                    day: "numeric"
                }
            );

        }


        /* =================================================
           CREATE CONTENT CARD
        ================================================= */

        function createContentCard(
            key,
            content
        ) {

            const article =
                document.createElement(
                    "article"
                );


            article.className =
                "library-content-card";


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                `reader.html?story=${encodeURIComponent(
                    key
                )}`;


            link.className =
                "library-content-link";


            const title =
                document.createElement(
                    "h4"
                );


            title.textContent =
                content.title;


            const date =
                document.createElement(
                    "p"
                );


            date.className =
                "content-date";


            date.textContent =
                content.published
                    ? `Published ${formatDate(
                        content.published
                    )}`
                    : "";


            link.appendChild(
                title
            );


            link.appendChild(
                date
            );


            article.appendChild(
                link
            );


            return article;

        }


        /* =================================================
           LOAD CONTENT
        ================================================= */

        Object.entries(
            window.STORIES || {}
        ).forEach(
            (
                [
                    key,
                    content
                ]
            ) => {


                if (
                    content.type ===
                    "blog"
                ) {

                    blogList.appendChild(
                        createContentCard(
                            key,
                            content
                        )
                    );

                }


                if (
                    content.type ===
                    "discussion"
                ) {

                    discussionList.appendChild(
                        createContentCard(
                            key,
                            content
                        )
                    );

                }

            }
        );


    }
);

</script>


<script
    src="control-panel.js">
</script>


<script
    src="script.js">
</script>


<script
    type="module"
    src="Beshy/beshy.js">
</script>


</body>

</html>
